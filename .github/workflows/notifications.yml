name: Notificaciones diarias
on:
  workflow_dispatch:
    inputs:
      type:
        description: "Tipo"
        required: false
        default: "hoy"
        type: choice
        options:
          - hoy
          - manana
          - reminders
  schedule:
    - cron: "*/15 * * * *"
jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar cron
        env:
          URL: "https://${{ secrets.DEPLOY_URL }}"
          SECRET: "${{ secrets.CRON_SECRET }}"
          INPUT: "${{ github.event.inputs.type }}"
        run: |
          if [ "$INPUT" = "reminders" ]; then
            curl -sS -H "x-cron-secret: $SECRET" "$URL/api/cron/reminders" || echo "::warning::reminders falló"
          elif [ "$INPUT" = "manana" ]; then
            curl -sS -H "x-cron-secret: $SECRET" "$URL/api/cron/agenda?type=manana" || echo "::warning::agenda manana falló"
          elif [ "$INPUT" = "hoy" ]; then
            curl -sS -H "x-cron-secret: $SECRET" "$URL/api/cron/agenda?type=hoy" || echo "::warning::agenda hoy falló"
          else
            curl -sS -H "x-cron-secret: $SECRET" "$URL/api/cron/reminders" || echo "::warning::reminders falló"
            curl -sS -H "x-cron-secret: $SECRET" "$URL/api/cron/agenda?type=hoy" || echo "::warning::agenda hoy falló"
            curl -sS -H "x-cron-secret: $SECRET" "$URL/api/cron/agenda?type=manana" || echo "::warning::agenda manana falló"
          fi
