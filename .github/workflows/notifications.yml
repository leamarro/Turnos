name: Notificaciones diarias
on:
  workflow_dispatch:
    inputs:
      type:
        description: "Tipo de notificación"
        required: true
        default: "hoy"
        type: choice
        options:
          - hoy
          - manana
          - reminders
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 0 * * *"
    - cron: "*/15 * * * *"
jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar cron
        run: |
          URL="https://${{ secrets.DEPLOY_URL }}"
          SECRET="${{ secrets.CRON_SECRET }}"

          case "${{ github.event.inputs.type || github.event.schedule }}" in
            "hoy"|"0 11 * * *")
              curl -sf -H "x-cron-secret: $SECRET" "$URL/api/cron/agenda?type=hoy"
              ;;
            "manana"|"0 0 * * *")
              curl -sf -H "x-cron-secret: $SECRET" "$URL/api/cron/agenda?type=manana"
              ;;
            "reminders"|"*/15 * * * *")
              curl -sf -H "x-cron-secret: $SECRET" "$URL/api/cron/reminders"
              ;;
          esac
